name: ntripcaster

services:
  postgres:
    image: postgres:16-alpine
    container_name: ntripcaster-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      POSTGRES_DB: ${DB_NAME:-ntripcaster_db}
      POSTGRES_USER: ${DB_USER:-ntripcaster}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    image: ${DOCKER_IMAGE_REPO:-docker.io/nevaberry/agopen-ntripcaster}:backend-${APP_TAG:-prod}
    container_name: ntripcaster-backend
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ntripcaster_db}
      DB_USER: ${DB_USER:-ntripcaster}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      Admin__Email: ${ADMIN_EMAIL:-admin@ntripcaster.local}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AgOpen Ntripcaster}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      NTRIP_PORT: ${NTRIP_PORT:-2101}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
    volumes:
      - ./logs:/app/logs:Z
      - ./backups:/backups:Z
      - ./data-protection-keys:/app/data-protection-keys:Z
    ports:
      - "${NTRIP_PORT:-2101}:2101"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: ${DOCKER_IMAGE_REPO:-docker.io/nevaberry/agopen-ntripcaster}:web-${APP_TAG:-prod}
    container_name: ntripcaster-nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - ntripcaster_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot
    container_name: ntripcaster-certbot
    restart: "no"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  postgres_data:
    driver: local
  certbot-etc:
  certbot-var:
  certbot-webroot:

networks:
  ntripcaster_network:
    driver: bridge
